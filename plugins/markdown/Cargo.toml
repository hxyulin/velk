[package]
name = "velk-plugin-markdown"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[[example]]
name = "velk_plugin_markdown"
path = "examples/standalone.rs"
crate-type = ["cdylib"]

[dependencies]
velk-plugin-sdk.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false }
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

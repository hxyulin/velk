[package]
name = "velk-plugin-completion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]

[dependencies]
velk-completion-matching.workspace = true
velk-plugin-sdk.workspace = true
velk-completion-contracts.workspace = true
serde_json = "1"
[dev-dependencies]
velk-plugin-sdk = { workspace = true, features = ["test-support"] }
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

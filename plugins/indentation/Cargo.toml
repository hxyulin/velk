[package]
name = "velk-plugin-indentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[[example]]
name = "velk_plugin_indentation"
path = "examples/standalone.rs"

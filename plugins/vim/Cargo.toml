[package]
name = "velk-plugin-vim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[[example]]
name = "velk_plugin_vim"
path = "examples/standalone.rs"
crate-type = ["cdylib"]
[dependencies]
velk-plugin-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
velk-undo-tree.workspace = true
velk-core.workspace = true
velk-editor-model.workspace = true
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

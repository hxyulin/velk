[package]
name = "velk-plugin-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[[example]]
name = "velk_plugin_lsp"
path = "examples/standalone.rs"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ropey.workspace = true
velk-plugin-sdk.workspace = true
lsp-types = "0.97.0"
serde_json = "1.0"
url = "2.5"
tokio = { version = "1.53.3", features = ["rt", "time", "macros", "process", "io-util", "sync"] }
[dev-dependencies]
velk-plugin-rust-analyzer.workspace = true
velk-semantic.workspace = true
tempfile = "3.27.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

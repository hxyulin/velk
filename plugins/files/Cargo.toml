[package]
name = "velk-plugin-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[dependencies]
velk-files-contracts.workspace = true
velk-plugin-sdk.workspace = true
velk-panels.workspace = true
serde_json = "1"
blake3 = "1.8"
notify = "8.2.0"
[dev-dependencies]
velk-plugin-sdk = { workspace = true, features = ["test-support"] }
tempfile = "3.27.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

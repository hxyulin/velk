[package]
name = "velk-plugin-rust-analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lib]
crate-type = ["rlib"]
[[example]]
name = "velk_plugin_rust_analyzer"
path = "examples/standalone.rs"
crate-type = ["cdylib"]

[dependencies]
velk-plugin-sdk.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

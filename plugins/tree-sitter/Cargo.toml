[package]
name = "velk-plugin-tree-sitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[[example]]
name = "velk_plugin_tree_sitter"
path = "examples/standalone.rs"
crate-type = ["cdylib"]

[dependencies]
velk-syntax.workspace = true
velk-core.workspace = true
velk-plugin-sdk.workspace = true
ropey.workspace = true
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[bench]]
name = "syntax"
harness = false

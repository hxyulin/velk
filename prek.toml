default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

# Text fixers run in order, then Rust formatting runs once for the workspace.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]
priority = 0

[[repos.hooks]]
id = "trailing-whitespace"
priority = 10

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 20

[[repos.hooks]]
id = "require-pattern"
name = "Conventional Commit"
stages = ["commit-msg"]
args = [
  "--multiline",
  '\A(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(?:\([^\r\n()]+\))?!?: [^\s][^\r\n]*(?:\r?\n|\z)',
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --all"
entry = "cargo fmt --all"
language = "system"
types_or = ["rust", "toml"]
pass_filenames = false
require_serial = true
priority = 30

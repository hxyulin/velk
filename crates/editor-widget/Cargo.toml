[package]
name = "velk-editor-widget"
description = "A rope-backed RXUI text editor widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
performance = []

[dependencies]
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velk-markup.workspace = true
velk-syntax.workspace = true
ropey.workspace = true
rxui.workspace = true
unicode-segmentation.workspace = true
unicode-bidi = "0.3.18"
unicode-ident = "1.0"

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "viewport"
harness = false
required-features = ["performance"]

[[bench]]
name = "responsiveness"
harness = false
required-features = ["performance"]

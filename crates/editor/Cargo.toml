[package]
name = "velk-editor"
description = "The Velk editor application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
performance = ["velk-editor-widget/performance"]

[[bin]]
name = "velk"
path = "src/main.rs"

[[example]]
name = "widget-preview"
path = "examples/widget-preview.rs"
required-features = ["performance"]

[dependencies]
velk-editing.workspace = true
velk-commands.workspace = true
velk-plugin-contracts.workspace = true
velk-editor-model.workspace = true
velk-core.workspace = true
async-channel = "2.5"
velk-panels.workspace = true
velk-diagnostics = { workspace = true, features = ["collector"] }
tracing.workspace = true
pollster = "0.4"
velk-search.workspace = true
velk-plugin-host.workspace = true
velk-markup.workspace = true
rxui = { workspace = true, features = ["native-dialogs"] }
velk-editor-widget.workspace = true
velk-semantic.workspace = true
ropey.workspace = true
blake3 = "1.8"
tempfile = "3.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rxui = { workspace = true, features = ["native-menus"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[package]
name = "velk-plugin-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[[example]]
name = "hooks-probe"
path = "tests/fixtures/hooks-probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "pack-probe"
path = "tests/fixtures/pack-probe.rs"
crate-type = ["cdylib"]

[[example]]
name = "duplicate-pack"
path = "tests/fixtures/duplicate-pack.rs"
crate-type = ["cdylib"]

[features]
test-support = []
markup = ["dep:velk-markup"]

[dependencies]
velk-core-contracts.workspace = true
ropey.workspace = true
velk-syntax.workspace = true
velk-editing.workspace = true
velk-plugin-contracts.workspace = true
serde_json = "1"
velk-diagnostics.workspace = true
velk-semantic.workspace = true
velk-markup = { workspace = true, optional = true }
velk-plugin-api.workspace = true
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[package]
name = "velk-diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
collector = ["dep:tracing-subscriber", "dep:tracing-appender", "dep:serde_json", "dep:arc-swap", "profiling/profile-with-tracing"]

[dependencies]
arc-swap = { version = "1", optional = true }
velk-plugin-api.workspace = true
tracing = "0.1.44"
profiling = { version = "1.0.18", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "warn"

[[bench]]
name = "instrumentation"
harness = false
required-features = ["collector"]

[workspace]
members = ["plugins/project", "plugins/autosave", "plugins/autopairs", "plugins/indentation", "crates/editing", "crates/commands", "crates/plugin-contracts", "crates/core", "crates/editor-model", "crates/panels", "plugins/files", "plugins/terminal", "crates/diagnostics", "crates/velk", "crates/editor", "crates/search", "crates/editor-widget", "crates/syntax", "crates/semantic", "crates/markup", "crates/plugin-api", "crates/plugin-sdk", "crates/plugin-host", "plugins/builtin", "plugins/markdown", "plugins/search", "plugins/lsp", "plugins/rust-analyzer", "xtask"]
default-members = ["crates/editor"]
resolver = "3"

[workspace.package]
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
velk-editing = { path = "crates/editing" }
velk-plugin-rust-analyzer = { path = "plugins/rust-analyzer" }
velk-commands = { path = "crates/commands" }
velk-plugin-contracts = { path = "crates/plugin-contracts" }
velk-core = { path = "crates/core" }
velk-editor-model = { path = "crates/editor-model" }
velk-panels = { path = "crates/panels" }
velk-diagnostics = { path = "crates/diagnostics" }
tracing = "0.1.44"
velk-search = { path = "crates/search" }
velk-plugin-api = { path = "crates/plugin-api" }
velk-plugin-sdk = { path = "crates/plugin-sdk" }
velk-plugin-host = { path = "crates/plugin-host" }
velk-markup = { path = "crates/markup" }
velk-semantic = { path = "crates/semantic" }
velk-syntax = { path = "crates/syntax" }
velk-editor-widget = { path = "crates/editor-widget" }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
rxui = { git = "https://github.com/hxyulin/rxui", rev = "aecda1e2840b72686a38a45f61382e3fe75a67b1", features = ["native"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.profiling]
inherits = "release"
debug = 2
split-debuginfo = "packed"
strip = "none"

[workspace]
members = ["crates/editor", "crates/editor-widget"]
default-members = ["crates/editor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.dependencies]
velk-editor-widget = { path = "crates/editor-widget" }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
rxui = { git = "https://github.com/hxyulin/rxui", rev = "96e1f4a833785edbce5885945a8bf8ba0a9e75f7", features = ["native"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
